<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Donate</title>
<style>
body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:#f6f4ef;margin:0;color:#222}
main{max-width:520px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin-bottom:14px}
h1{margin:0;color:var(--brand,#0f5e63);font-size:24px}h2{font-size:17px;margin:0 0 8px}.sub{color:#666}

.qr{text-align:center}.qr img{width:240px;height:240px}.hp{position:absolute;left:-5000px}
#msg{margin-top:10px}.ok{color:#17703a}.err{color:#b3261e}
