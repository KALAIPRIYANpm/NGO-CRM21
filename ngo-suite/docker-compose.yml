# Run on a small server with Docker. Gives you https://YOUR-DOMAIN with an automatic certificate.
# 1. Point your domain's DNS A record at the server.  2. Copy .env.example to .env and fill it in.  3. docker compose up -d
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NGO_ADMIN_PASSWORD: ${NGO_ADMIN_PASSWORD:?Set a first admin password in .env}
    volumes:
      - ngo-data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?Set your domain in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]
volumes:
  ngo-data:
  caddy-data:
